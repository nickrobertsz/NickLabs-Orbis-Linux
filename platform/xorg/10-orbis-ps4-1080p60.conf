# NickLabs Orbis — /usr/share/X11/xorg.conf.d/10-orbis-ps4-1080p60.conf
# ps4_bridge only accepts CEA VIC 16 (1080p60) and VIC 4 timings; a mode with
# slightly different pixel clock is rejected ("attempted to set non-CEA mode").
# Some kernels also advertise 1080p120, which blanks 60 Hz panels. Pin 1080p60.
Section "Monitor"
    Identifier "orbis-hdmi"
    Option     "PreferredMode" "1920x1080"
    # Exact CEA-861 VIC 16 timing, 148.5 MHz.
    Modeline   "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Device"
    Identifier "orbis-liverpool"
    Driver     "amdgpu"
    Option     "Monitor-HDMI-A-0" "orbis-hdmi"
    Option     "Monitor-HDMI-A-1" "orbis-hdmi"
EndSection
